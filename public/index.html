<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0a">
    <title>Antigravity Link</title>
    <style>
        :root {
            --bg-deep: #0a0a0a;
            --bg-dock: rgba(18, 18, 18, 0.98);
            --bg-card: #1c1c1c;
            --accent: #3b82f6;
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #e5e5e5;
            --text-dim: #a3a3a3;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100dvh; width: 100vw; overflow: hidden;
            background: var(--bg-deep); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
        }

        body { display: flex; flex-direction: column; }

        #topBar {
            position: fixed; top: calc(var(--safe-top) + 12px); left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; pointer-events: none;
        }

        .badge {
            background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 20px;
            display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700;
            z-index: 1000; border: 1px solid var(--border); backdrop-filter: blur(12px); pointer-events: auto;
        }

        #statusDot { width: 8px; height: 8px; border-radius: 50%; background: #555; transition: background 0.3s; }
        #statusDot.online { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
        #statusDot.offline { background: #f87171; }

        #instancesBtn {
            position: fixed; top: calc(var(--safe-top) + 12px); right: 16px;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(0,0,0,0.6); border: 1px solid var(--border);
            color: white; z-index: 1000; display: flex; align-items: center; justify-content: center;
            font-size: 20px; backdrop-filter: blur(12px); pointer-events: auto; cursor: pointer;
        }

        .chat-container { flex: 1; overflow-y: auto; padding-top: calc(var(--safe-top) + 64px); -webkit-overflow-scrolling: touch; }
        .chat-content { padding: 16px; min-height: 101%; }

        .bottom-dock {
            background: var(--bg-dock); border-top: 1px solid var(--border);
            padding-bottom: var(--safe-bottom); backdrop-filter: blur(24px); z-index: 1000;
        }

        .dock-controls {
            display: flex; gap: 10px; padding: 10px 16px; overflow-x: auto;
            scrollbar-width: none; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .dock-controls::-webkit-scrollbar { display: none; }

        .control-chip {
            background: rgba(255,255,255,0.08); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
            white-space: nowrap; display: none; align-items: center; gap: 6px;
            color: var(--text-dim); cursor: pointer;
        }
        .control-chip.active { color: white; border-color: var(--accent); background: rgba(59, 130, 246, 0.2); }

        .dock-input-row { padding: 12px 16px; display: flex; align-items: flex-end; gap: 12px; }
        .input-bubble {
            flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
            border-radius: 24px; padding: 4px 16px; transition: border-color 0.2s;
        }
        .input-bubble:focus-within { border-color: var(--accent); }
        #messageInput {
            width: 100%; background: transparent; border: none; outline: none;
            color: white; font-size: 16px; line-height: 1.4; resize: none;
            min-height: 24px; max-height: 160px; padding: 8px 0;
        }

        #sendBtn {
            background: var(--accent); border: none; width: 44px; height: 44px;
            border-radius: 50%; color: white; display: flex; align-items: center;
            justify-content: center; font-size: 20px; flex-shrink: 0; cursor: pointer;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); display: none; align-items: center;
            justify-content: center; z-index: 2000; backdrop-filter: blur(10px);
        }
        .modal-overlay.show { display: flex !important; }

        .bottom-sheet {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card);
            border-top-left-radius: 28px; border-top-right-radius: 28px;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2100; max-height: 85vh; display: flex; flex-direction: column;
            border-top: 1px solid var(--border);
        }
        .bottom-sheet.show { transform: translateY(0) !important; }

        .sheet-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

        .artifacts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px; }
        .card {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            padding: 20px; border-radius: 20px; text-align: center; cursor: pointer;
        }
        .card-icon { font-size: 32px; margin-bottom: 8px; }
        .card-name { font-size: 14px; font-weight: 600; color: white; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        #sheetOverlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; z-index: 2050; }
        #sheetOverlay.show { display: block !important; }

        .spinner { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="topBar">
        <div class="badge"><div id="statusDot"></div><span id="statusText">CONNECTING</span></div>
        <button id="instancesBtn" class="icon-btn">🖥️</button>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="chat-content" id="chatContent">
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:100px 0; color:var(--text-dim);">
                <div class="spinner"></div>
                <span style="margin-top:16px">Syncing...</span>
            </div>
        </div>
    </div>

    <div class="bottom-dock">
        <div id="nativeStatusBar" class="dock-controls" style="display:none">
            <div id="modeChip" class="control-chip">MODE: <span id="modeVal"></span></div>
            <div id="artifactsChip" class="control-chip">📦 Artifacts (<span id="artifactsVal">0</span>)</div>
        </div>
        <div class="dock-input-row">
            <button id="uploadBtn" class="icon-btn" style="background:none; border:none; font-size:20px; color:white;">📎</button>
            <div class="input-bubble"><textarea id="messageInput" placeholder="Message..." rows="1"></textarea></div>
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <div id="loginModal" class="modal-overlay"><div style="background:var(--bg-card); padding:32px; border-radius:24px; width:90%; max-width:340px; border:1px solid var(--border);"><h2>🔐 Login</h2><input type="password" id="tokenInput" style="width:100%; margin:20px 0; padding:14px; background:#000; border:1px solid var(--border); border-radius:12px; color:white;"><button id="loginBtn" style="width:100%; padding:14px; background:var(--accent); border:none; border-radius:12px; color:white; font-weight:bold;">Authorize</button></div></div>
    <div id="instancesModal" class="modal-overlay"><div style="background:var(--bg-card); padding:32px; border-radius:24px; width:90%; max-width:340px; border:1px solid var(--border);"><div style="display:flex; justify-content:space-between; align-items:center;"><h3>🖥️ Instances</h3><span id="closeInstances" style="cursor:pointer; font-size:24px;">&times;</span></div><div id="instancesList" style="margin-top:20px;"></div></div></div>
    <div id="artifactsSheet" class="bottom-sheet"><div class="sheet-header"><h3>Artifacts</h3><span id="closeArtifacts" style="cursor:pointer; font-size:28px;">&times;</span></div><div class="grid" id="artifactsGrid"></div></div>
    <div id="sheetOverlay"></div>

    <script>
        // Use hoisted function declarations
        window.updateControls = function(html) {
            const temp = document.createElement('div'); temp.innerHTML = html;
            const arts = temp.querySelectorAll('.artifact-container');
            if (arts.length) {
                document.getElementById('artifactsVal').innerText = arts.length;
                document.getElementById('nativeStatusBar').style.display = 'flex';
                document.getElementById('artifactsChip').style.display = 'inline-flex';
                const grid = document.getElementById('artifactsGrid'); grid.innerHTML = '';
                arts.forEach(a => {
                    const card = document.createElement('div'); card.className = 'card'; card.innerHTML = '<div class="card-icon">📦</div><div class="card-name">Artifact</div>';
                    card.onclick = () => toggle('artifactsSheet', false, true); grid.appendChild(card);
                });
            }
            const mode = Array.from(temp.querySelectorAll('button')).find(b => /Planning|Fast|Agent/.test(b.innerText));
            if (mode) {
                document.getElementById('modeVal').innerText = mode.innerText.trim();
                document.getElementById('modeChip').style.display = 'inline-flex';
                document.getElementById('nativeStatusBar').style.display = 'flex';
            }
        };
        window.renderSnapshot = function(d) { if(d && document.getElementById('chatContent')) document.getElementById('chatContent').innerHTML = d.html; };

        function toggle(id, show, overlay = false) {
            const el = document.getElementById(id); if(!el) return;
            if(show) { el.classList.add('show'); if(overlay) document.getElementById('sheetOverlay').classList.add('show'); }
            else { el.classList.remove('show'); if(overlay) document.getElementById('sheetOverlay').classList.remove('show'); }
        }

        window.onload = function() {
            document.getElementById('instancesBtn').onclick = () => toggle('instancesModal', true);
            document.getElementById('closeInstances').onclick = () => toggle('instancesModal', false);
            document.getElementById('artifactsChip').onclick = () => toggle('artifactsSheet', true, true);
            document.getElementById('closeArtifacts').onclick = () => toggle('artifactsSheet', false, true);
            document.getElementById('sheetOverlay').onclick = () => { ['artifactsSheet', 'instancesModal'].forEach(id => toggle(id, false, true)); };
            if(!localStorage.getItem('ag_auth_token')) document.getElementById('loginModal').classList.add('show');
        };
    </script>
</body>
</html>
